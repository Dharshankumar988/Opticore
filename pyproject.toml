[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opticore-cli"
version = "1.2.0"
authors = [
    { name = "OptiCore Vision Team" }
]
description = "Cross-platform CLI Command Center for OptiCore Assistive Vision API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pyttsx3>=2.90",
    "opencv-python>=4.7.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
opticore-cli = "opticore_cli.cli:main"
